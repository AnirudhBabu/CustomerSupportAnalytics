name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Microsoft's Power BI project (PBIR) schemas, pinned for reproducible checks
  JSON_SCHEMAS_SHA: 0346d0e844495d7786c09d7c4bebe0d3b191f411

jobs:
  unit:
    name: Unit and contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/test.txt
      - name: Fetch Power BI report schemas
        run: |
          git init -q "$RUNNER_TEMP/json-schemas"
          cd "$RUNNER_TEMP/json-schemas"
          git remote add origin https://github.com/microsoft/json-schemas.git
          git fetch -q --depth 1 origin "$JSON_SCHEMAS_SHA"
          git checkout -q FETCH_HEAD
      - name: Run tests (database and Metabase tests are skipped here)
        env:
          PBIR_SCHEMAS_DIR: ${{ runner.temp }}/json-schemas
        run: python -m unittest discover -s tests -t . -v

  pipeline:
    name: Pipeline, dbt build and warehouse parity
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics -d support"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: analytics
      PGPASSWORD: ci-password
      PGDATABASE: support
      METABASE_READER_PASSWORD: ci-reader-password
      METABASE_APP_DB_PASSWORD: ci-app-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
      - run: pip install -r requirements/test.txt
      - name: Create roles and schemas (same script the Postgres container runs)
        run: bash infra/postgres/init/01-roles-and-databases.sh
      - name: Run the pipeline (generate -> load -> dbt build -> export)
        run: python -m pipeline.run
      - name: Run all tests against the warehouse
        run: python -m unittest discover -s tests -t . -v
      - name: Keep dbt run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-run-results
          path: |
            transform/target/run_results.json
            transform/target/manifest.json
            transform/logs/dbt.log
          if-no-files-found: ignore

  stack:
    name: Full stack (Docker Compose + Metabase end to end)
    runs-on: ubuntu-24.04
    needs: [unit]
    env:
      MB_URL: http://localhost:3000
      MB_ADMIN_EMAIL: admin@example.com
      MB_ADMIN_PASSWORD: Support-Analytics-2026
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PASSWORD: metabase-reader-dev-password
      PGHOST: localhost
      PGUSER: analytics
      PGPASSWORD: analytics-dev-password
      PGDATABASE: support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/test.txt
      - name: Let the pipeline container write the export into data/
        run: chmod a+w data
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the pipeline and Metabase provisioning to finish
        run: |
          timeout 900 docker compose wait pipeline
          timeout 900 docker compose wait metabase-setup
      - name: End-to-end tests through the Metabase API, plus warehouse checks
        run: python -m unittest tests.test_metabase_e2e tests.test_warehouse -v
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop the stack
        if: always()
        run: docker compose down -v

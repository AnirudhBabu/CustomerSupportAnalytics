name: support_analytics
version: "1.0.0"
config-version: 2
profile: support_analytics

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Service levels. These are the single definition of the SLA thresholds;
  # a data test checks they agree with the flags in the raw data.
  response_sla_minutes: 30
  resolution_sla_hours: 24

models:
  support_analytics:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +materialized: table
      +grants:
        select: ["{{ env_var('ANALYTICS_READER_ROLE', 'metabase_reader') }}"]
    metrics:
      +materialized: table
      +grants:
        select: ["{{ env_var('ANALYTICS_READER_ROLE', 'metabase_reader') }}"]

on-run-end:
  # BI tools connect as a read-only role that can see the analytics schema only
  - "grant usage on schema {{ target.schema }} to {{ env_var('ANALYTICS_READER_ROLE', 'metabase_reader') }}"
